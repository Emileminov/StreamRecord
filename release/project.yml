name: StreamRecord
options:
  deploymentTarget:
    macOS: "12.0"
targets:
  StreamRecord:
    type: application
    platform: macOS
    sources:
      - path: ../Sources/main.swift
      - path: AppIcon.icns
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: StreamRecord
        PRODUCT_BUNDLE_IDENTIFIER: com.emil.streamrecord
        INFOPLIST_FILE: ../Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: ../StreamRecord.entitlements
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_TEAM: 4AR298V292
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "2"
        ARCHS: "arm64 x86_64"
        ONLY_ACTIVE_ARCH: NO
